name: CI

on:
  push:
  pull_request:
    # edited: a changed PR title or body is rechecked for the wording rule.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own result; other refs only need the latest.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check reads commit messages
      - run: bash scripts/check-wording.test.sh
      - name: Check wording
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Only the commits this event adds, so an old commit can't fail every run.
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"
          fi
          WORDING_COMMITS="$range" bash scripts/check-wording.sh

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The same package scripts as local runs (gofmt, vet, staticcheck).
      - run: pnpm --filter @lumbung/engine lint
      - run: pnpm --filter @lumbung/engine test
      - run: pnpm --filter @lumbung/engine vulncheck
      - name: OpenAPI document matches the handlers
        run: |
          pnpm --filter @lumbung/engine openapi:gen
          git diff --exit-code -- apps/engine/openapi.json
      - name: Generated docs and SDK types match the code
        run: |
          pnpm --filter @lumbung/engine docs:gen
          pnpm --filter @lumbung/engine sdk:gen
          git diff --exit-code -- apps/site/src/content/docs/docs/reference packages/client/src/generated.ts

  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      # PLAN 6.2: statements through the query path must never create or
      # change a file outside the attacking branch.
      - run: go test -run '^$' -fuzz '^FuzzQueryPath$' -fuzztime 60s ./internal/engine

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SDK and CLI tests run against a real lumbungd built from this commit.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!@lumbung/engine' -r typecheck
      - run: pnpm --filter '!@lumbung/engine' -r --if-present test
      - run: pnpm --filter @lumbung/site build
      - run: pnpm check:links
      # Every code sample in the docs runs against a live engine.
      - run: pnpm --filter @lumbung/client build
      - run: pnpm docs:test
