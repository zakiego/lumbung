name: Release client

# Publishes @lumbung/client to npm when a client-vX.Y.Z tag is pushed. The tag
# must match packages/client/package.json. Steps: ops/README.md.
on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing signs in with GitHub's OIDC token
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/client/package.json").version')
          if [ "$TAG" != "client-v$version" ]; then
            echo "::error::tag $TAG doesn't match packages/client version $version"
            exit 1
          fi
      # SDK tests build and start a real lumbungd from this commit.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number)
            if (a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))) process.exit(0)
            console.log(`::error::npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1 or later)`)
            process.exit(1)
          ' "$v"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumbung/client build
      - run: pnpm --filter @lumbung/client typecheck
      - run: pnpm --filter @lumbung/client test
      # The workspace keeps "private" so nothing publishes it from a laptop.
      - name: Publish
        working-directory: packages/client
        env:
          # Only for the first release, before the package exists on npm. Once
          # the trusted publisher is set up, delete the secret and npm signs in
          # with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg delete private
          npm pkg set \
            "repository.type=git" \
            "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" \
            "repository.directory=packages/client"
          npm publish --access public
