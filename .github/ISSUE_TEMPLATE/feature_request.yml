name: Feature request
description: Suggest something Lumbung should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. API shape, CLI command or screen, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
