name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, don't open an issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or requests that shows the problem.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [Engine (lumbungd), CLI (lumbung), Dashboard, TypeScript SDK, MCP, libSQL protocol, S3 API, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lumbung version`, or the commit you built from.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lumbungd or dashboard output. Remove tokens first.
      render: text
